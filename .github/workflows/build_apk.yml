name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AnkiDroid-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiDroid-debug-apk
          path: AnkiDroid-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk AnkiDroid-debug.apk --clobber
          else
            gh release create latest-apk AnkiDroid-debug.apk \
              --target "${{ github.sha }}" \
              --title "Latest Debug APK" \
              --notes "Built automatically from commit ${GITHUB_SHA::7}"
          fi
